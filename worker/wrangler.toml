name = "policy-sentinel-demo"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Application observability is off. Hosting providers have their own policies.
[observability]
enabled = false

# The binding and temporary in-memory fallback use the connecting address to limit requests.
[[ratelimits]]
name = "RATE"
namespace_id = "7301"
  [ratelimits.simple]
  limit = 30
  period = 60

# Secrets (never in this file). Add with:
#   npx wrangler secret put DATA_GOV_API_KEY --config worker/wrangler.toml
