schema_version: '1.0'
source_revision: c65949fef2c8e331097cbaf9c32f04983cde2a64
purpose: Finite preparation findings to carry into the approved successor implementation
authority: Prompt review does not repair code or change product/source/release acceptance
findings:
  - id: FA-01
    priority: high
    classification: verified_ledger_representation_conflict
    evidence: scripts/validate-roadmap.mjs 669-677, 2143-2144, 2164-2165; full ROADMAP read by authority reviewer
    finding: Schema 1.6 rejects a new or reactivated maintenance item while PS09 remains blocked.
    prompt_requirement: Bootstrap a narrowly versioned independent maintenance item/gate/focus with explicit schema compatibility and negative guard tests; preserve all PS09 and historical states.
    represented_in_prompt: true
    preparation_state: not_started
  - id: FA-02
    priority: medium
    classification: requirement_coverage_risk
    evidence: docs/pnw-scope-and-acceptance.md 184-224; candidate manifests; decision-register O-001..022 and B-001..012
    finding: A generic crosswalk can omit unresolved output/persona/deployment/scenario requirements or erase interface-specific gaps after direct-route success.
    prompt_requirement: Account for all 12 clauses, nine manifests, decision IDs and convergence components with source-bound scope dispositions; reconcile O-017 only within proved scope.
    represented_in_prompt: true
    preparation_state: not_started
  - id: FA-03
    priority: medium
    classification: verified_hash_domain_distinction
    evidence: docs/vision/o0-orchestration-contract.md; ROADMAP.yaml canonical seal; prior seed raw working hash
    finding: O0 raw CRLF bytes and canonical LF bytes are different valid identities, not evidence of corruption.
    raw_bytes: 117080
    raw_sha256: 0f61c8d4b8da9f339b39ce3460358d5a89cad5c3d5e17b249161a9f876966d5f
    canonical_lf_bytes: 116551
    canonical_lf_sha256: f4f39c0b7ac2b5ce763d47785b82d0e162fc1217a41377490e8c926ed8cdd381
    prompt_requirement: Type hash domains; never normalize sealed originals; select exactly 33 owner plus 43 historical protected artifacts, not every old dist/cache inventory entry.
    represented_in_prompt: true
    preparation_state: not_started
  - id: FA-04
    priority: low
    classification: pilot_acceptance_gap
    evidence: Approved external proposal reading-pilot requirement
    finding: Questions alone do not predeclare the success criteria or separate agent navigation from human usability.
    prompt_requirement: Freeze answers, evidence, 10/10 source correctness, zero invented authority, visible stale pins, timing method and upkeep criterion before execution.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ENG-01
    priority: high
    classification: verified_test_discovery_gap
    evidence: package.json scripts; vitest.config.ts include; tests/pipeline/pipeline.test.ts nested Node runner; tracked test inventory
    finding: Four of 25 tracked Node test files are outside aggregate execution. Roadmap tests already run through the nested wrapper.
    omitted_paths:
      - tests/pipeline/backbone-validator.test.mjs
      - tests/adapters/federal-register/tier1-contract.test.mjs
      - tests/adapters/federal-register/tier1-refresh.test.mjs
      - tests/adapters/federal-register/tier1-transport.test.mjs
    prompt_requirement: Audit offline/temp-root safety and oracle validity, then reconcile every test to execution or a reviewed exclusion and integrate relevant suites.
    limit: These four suites were not run in preparation; no claim that they fail. Refresh includes a negative acquire path and cannot be called independently network-isolated yet.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ENG-02
    priority: medium
    classification: verified_cleanup_failure_path
    evidence: scripts/verify-policy-browser.mjs 1531 onward; installed Playwright 1.61.1 close implementation; Context7 API docs
    finding: A rejected browser.close can bypass report finalization and persistence in finally.
    prompt_requirement: Preserve primary and cleanup errors separately, attempt report persistence regardless, retain nonzero outcome and add synthetic cleanup/write-failure regressions.
    limit: Static and in-memory control-flow evidence, not a real browser fault; existing persisted accepted report remains valid for its scope.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ENG-03
    priority: medium
    classification: untested_promise_failure_path
    evidence: scripts/verify-policy-browser.mjs 628; Playwright download.cancel returns Promise<void>
    finding: void download.cancel does not observe rejection or ensure cancellation settles before report sealing.
    prompt_requirement: Track/await cleanup promises and surface bounded failures before sealing the report.
    limit: Accepted run had no downloads; this does not retroactively invalidate it.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ENG-04
    priority: medium
    classification: generator_design_risk
    evidence: Approved detached Obsidian reading-vault proposal
    finding: A disposable label alone does not protect edited/unknown files or prevent generated-text interpretation.
    prompt_requirement: Exact owned-output manifest, stable collision-safe filenames, literal escaping, no embeds, atomic staging, fail-before-overwrite and deletion only of unchanged owned projections.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ENG-05
    priority: medium
    classification: command_evidence_risk
    evidence: PowerShell native exit and nonterminating-error behavior; resolved discovery-read errors in this review
    finding: Later successful commands can conceal earlier command failures in aggregate shell status.
    prompt_requirement: Check each native exit status and relevant terminating cmdlet errors; classify warnings/truncation/skips and preserve original failure evidence.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ENG-06
    priority: medium
    classification: verified_negative_oracle_masking
    evidence: tier1-refresh.test.mjs 1010-1053; refresh-federal-register-prerelease.mjs runtime guard at 768-774 before CA guard at 783-789
    finding: Current Node 24.19.0 fails frozen v24.14.1 runtime guard before the CA override condition; generic process_boundary can satisfy the wrong test assertion.
    prompt_requirement: Isolate or repair the intended-guard oracle; preserve historical runtime pin and no-acquisition boundary; label unavailable proof if it cannot safely be exercised.
    limit: Reachable-path inspection, not an executed pass/failure of that suite.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ROOT-01
    priority: high
    classification: reproduced_aggregate_failure_signaling
    evidence: scripts/acquire-policy-batch.mjs 48-64; probe-results.json child-accounted-failure-exit-2
    finding: failed=1 can be reported while the module completes normally without a nonzero exit assignment.
    prompt_requirement: Define and test nonzero aggregate failure outcome without changing durable accounting or retry restrictions.
    limit: Exact module text executed under injected imports/process; no real source request or full CLI/custody execution.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ROOT-02
    priority: medium
    classification: reproduced_lost_child_diagnostic
    evidence: scripts/acquire-policy-batch.mjs 55; probe-results.json spawn-failure-empty-stderr
    finding: Empty stderr wins a nullish fallback over a meaningful child.error message.
    prompt_requirement: Preserve bounded redacted spawn/timeout/signal diagnostics without retaining sensitive stderr/raw responses.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ROOT-03
    priority: medium
    classification: verified_library_behavior_and_validator_design_risk
    evidence: YAML 2.9.0 installed public-api.js and probe-results.json
    finding: parseDocument errors are data; parse with silent logging can accept duplicate keys.
    prompt_requirement: Explicit Document.errors, unique-key/multiple-document and alias/input-bound checks; never suppress parser errors to make metadata pass.
    limit: No existing repository YAML parser defect is asserted; this constrains the new knowledge validator.
    represented_in_prompt: true
    preparation_state: not_started
  - id: ROOT-04
    priority: medium
    classification: metadata_identity_design_risk
    evidence: Current seeds pin source documents to the prior Git revision; next session will edit some of those documents
    finding: Blind hash refresh loses historical provenance, while self/containing-commit pins can create circular commit requirements.
    prompt_requirement: Distinguish current freshness from historical citations; avoid self-pins; use reviewed source changes followed by actual-revision metadata checkpoints.
    represented_in_prompt: true
    preparation_state: not_started


