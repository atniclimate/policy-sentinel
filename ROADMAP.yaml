      - G-E-PUBLISH
    authorization_gate: G-E-PUBLISH
    acceptance:
      - The owner explicitly identifies the accepted commit, workflow, and
        production deployment operation.
      - The deployment is run and inspected with gh only.
      - Deployment health, assets, source coverage, limitations, and public URL
        are verified after publication.
      - The public-beta state changes to complete only after production
        verification passes.
    safe_fallback: >-
      Preserve the configured but undeployed project and the accepted local
      release candidate.
    unblocks_only_when: >-
      The owner explicitly approves the exact production deployment and public
      beta publication operation.
    evidence:
      - "The initial prompt expressly withheld deployment and publication
        approval."

