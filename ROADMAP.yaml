    priority: 1
    milestone: Phase A
    title: Foundation, feasibility, and written implementation plan
    status: complete
    dependencies: []
    acceptance:
      - All Phase A documents, schemas, taxonomy, and synthetic contracts exist.
      - Phase A validation passes and the owner approves Phase B.
    evidence:
      - "Commit e22512e: docs: establish Policy Sentinel Phase A foundation"
      - "Owner approved Phase B on 2026-07-30."

  - id: H-HANDOFF
    priority: 2
    milestone: Durable workflow
    title: Canonical YAML course and Sol Ultra continuation handoff
    status: complete
    dependencies:
      - A-FOUNDATION
    acceptance:
      - ROADMAP.yaml records progress, dependencies, gates, evidence, and finish
        states.
      - The roadmap is parsed and semantically validated by npm run check.
      - AGENTS.md and README.md direct future sessions to the ledger.
      - docs/continuation-prompt.md supports autonomous compaction-safe
        execution.
      - Cooperative and adversarial reviews find no gate or scope inversion.
    evidence:
      - "ROADMAP.yaml and docs/continuation-prompt.md created 2026-07-30."
      - "npm run check passed 2026-07-30: roadmap, formatting, lint, types,
        source boundary, 31 tests, build, and 7-asset artifact validation."
      - "npm audit reported 0 vulnerabilities on 2026-07-30."
      - "Final cooperative and adversarial reviews reported handoff-ready with
        no blockers on 2026-07-30."
      - "Commit e2f08c9: docs: add durable Sol Ultra execution handoff"

  - id: B1-APP
    priority: 10
    milestone: B1
    title: Static synthetic single-Nation vertical slice
    status: complete
    dependencies:
      - A-FOUNDATION
    acceptance:
      - Guided Nation, policy-area, and landmark entry paths work with synthetic
        data.
      - Filters apply explicitly; details, selection, dossier, and CSV work.
      - Semantic, keyboard, responsive, and automated accessibility checks pass.
      - Browser operation makes no provider, telemetry, analytics, or LLM calls.
    evidence:
      - "Commit 8357691."
      - "Desktop and mobile browser smoke passed on 2026-07-30."
      - "Automated application and accessibility tests passed at baseline."

  - id: B2-PARSER
    priority: 20
    milestone: B2
    title: Official annual-recognition-notice transcription validator
    status: complete
    dependencies:
      - A-FOUNDATION
    acceptance:
      - The official current notice parses to exactly 577 ordered source-exact
        list-entry paragraphs, 348 contiguous and 229 Alaska.
      - Ordered structured-source and bounded GovInfo hashes, the stated total
        of 575, headings, See clauses, metadata, and correction links fail
        closed on drift.
      - Every grouping and cross-reference paragraph remains source evidence;
        the validator emits no Nation registry while row reconciliation is
        unresolved.
      - Any future validation output is restricted to ignored BIA staging and
        the exact legacy deploy-tree output is removed.
      - Contacts, addresses, geometry, and land fields are excluded.
    evidence:
      - "Commit fbb54f1."
      - "The review records ordered-entry hash c33e8471..., bounded GovInfo hash
        f8071894..., and independent PDF comparison hash 3fa7b37a...."
      - "npm run check passed 6 Vitest files and 36 tests on 2026-07-31."
      - "npm run source:bia verified the live source, then exited 1 at the
        identity gate with no staging or legacy output."

  - id: B2-REVIEW
    priority: 21
    milestone: B2
    title: Independent recognition-notice identity review
    status: blocked
    dependencies:
      - B2-PARSER
    blocked_by:
      - G-BIA-IDENTITY
    acceptance:
      - Two independent reviews reconcile count, list paragraphs, grouped names,
        punctuation, and cross-references.
      - Discrepancies are mechanically compared and adjudicated against exact
        official language.
      - Review evidence is durable without committing raw source material.
      - Regression fixtures cover every adjudicated edge case.
    evidence:
      - "docs/source-reviews/bia-2026-recognition-review.md records two
        independent methods, exact hashes, disputed rows, and the fail-closed
        decision."
      - "The 2026 notice displays 577 ordered list-entry paragraphs while
        stating 575 entities and provides no current row-level reconciliation."
      - "The August 2023 notice withdrew the 2022 and January 2023
        clarification, so that superseded exclusion rule cannot be reused."
      - "Commit fbb54f1 removes the unsupported Venetie-only alias rule and
        emits no registry."
    safe_fallback: >-
      Emit no live Nation registry or Nation-specific state coverage; keep the
      application synthetic and visibly unavailable for production data.
    unblocks_only_when: >-
      Current originating BIA evidence unambiguously reconciles the displayed
      paragraphs to the stated 575 entities and the exact mapping passes two
      independent reviews.
    next_step: >-
      Resume only when current originating BIA evidence supplies the exact
      row-level reconciliation; do not infer it from arithmetic, TLD, grouping,
      aliases, geography, or contact.

  - id: B2-IDS
    priority: 22
    milestone: B2
    title: Stable Nation ID and official-alias carry-forward
    status: not_started
    dependencies:
