handoff_report_contract:
  required_fields:
    - starting repository truth and exact owner-direction file identities
    - current capability delta without relabeling planning as implementation
    - completed work items and evidence
    - remaining ready, blocked, deferred, and not-started items
    - exact PNW work-item counts, finish roots, and gate effects
    - primary-source and reproduction gaps
    - roster, deployment-authority, geography, taxonomy, and output-review gaps
    - exact first implementation tranche, allowed paths, tests, and stop
      conditions
    - hook, skill, custom-agent, and independent-review disposition
    - exact commands and real outcomes
    - browser, accessibility, privacy, security, and artifact findings
    - protected K0, S0, and O0 identities and unchanged convergence state
    - local commit SHAs
    - git status
    - closed boundary between local readiness and external publication
    - exactly one required terminal disposition
  forbidden_claims:
    - Policy Sentinel is complete because plans or fixtures exist.
    - A blocked source is covered.
    - A local release candidate is a published beta.
    - An inferred Nation relationship is source-explicit.
