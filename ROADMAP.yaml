roadmap_id: policy-sentinel-through-finish
project:
  name: Policy Sentinel
  root: 'I:\policy-sentinel'
  phase: >-
    General development (owner direction, 2026-09-22). The non-PS09 Makah demo
    track was delivered at the ATNI Annual Convention and is finished: both of
    its items are complete on commit evidence (554e105 and 07d5fb2, 2026-09-15).
    The project returns to general engine development, with nationwide coverage
    (Tribal, federal and state sources across the United States) as a core
    capability. The realignment audit
    (docs/audits/2026-09-22-general-dev-audit.md) records the code as found. The
    module design (docs/architecture/module-boundaries.md) defines a shared core
    plus intake, geographic/context association and output modules. The owner
    ruled on the realignment questions on 2026-09-22
    (docs/decisions/2026-09-22-realignment-rulings.md, transcribed as D-071 to
    D-079 in docs/decision-register.md). Under D-071 the ledger used schema
    1.10: milestone "General development" (GD-00 to GD-23 from the design and
    docs/architecture/general-development-addendum-2026-09-22.md) is admitted by
    rule behind four named gates, and every other milestone keeps its frozen 1.9
    identities. Schema 1.11 represents D-086/D-087 successor authority and the
    explicit GD-31 acceptance crosswalk. GD-27-LOCAL-RELEASE-PACKAGE is the
    current general-engine local release root, with every required capability,
    demonstration and unresolved historical claim carried forward. Retained PS09
    state is unchanged: POLICY-SENTINEL-REAL-POLICY-DISCOVERY-01 completed its
    bounded local workbench outcome through PS09-03/04/05; the program remains
    blocked on PS09-02 identity/scenario evidence, an explicit PS09-06
    prerequisite; PS09-06-LOCAL-RC is the historical release root and remains
    unstarted and gated. EV01, Run 1/2 and archived lanes retain their
    historical evidence and spent-operation boundaries.
  updated_on: "2026-10-07"
  owner_intent: >-
    Build and validate a sovereignty-centered general Policy Sentinel engine,
    prove its present definition of done through the owner-selected PNW scenario
    cohort without making exact ATNI membership a universal release gate. Treat
    nationwide coverage (Tribal, federal and state sources across the United
    States) as a core capability of the general engine, carried by jurisdiction
    identifiers rather than geometry, and retain separately modeled
    international expansion as a later direction. Treat documents, web modules,
    applications, and structured exports as adapters over one analyzed corpus.
    Investigate actual policy documents, temporal histories, institutional
    mechanisms and cross-jurisdiction patterns with inspectable evidence and
    provisional analytical claims. Synthetic fixtures are regression tools, not
    the intended product-data boundary. Respect source-specific evidence and the
    current exact execution, private-data, and publication authority.

canonical_ledger:
  authority: >-
    This file is the canonical machine-readable execution ledger. Binding
    product and governance decisions remain in the referenced documents.
  update_rule: >-
    Reconcile this ledger with repository evidence at startup and after every
    material checkpoint. Never mark work complete from scaffolding or agent
    assertion alone.
  allowed_work_item_statuses:
    - complete
    - in_progress
    - ready
    - blocked
    - deferred
    - not_started
  allowed_gate_states:
    - approved
    - closed
    - pending_evidence
    - satisfied
  allowed_finish_states:
    - not_started
    - in_progress
    - complete
    - blocked
  allowed_additive_phase_stages:
    - contract_design
    - contract_freeze
    - contract_review
    - implementation
    - implementation_review
    - completion
  status_semantics:
    complete: >-
      The bounded work-item acceptance contract has objective evidence. It does
      not by itself mean source activated, PNW integrated, release-ready,
      published, or universally complete.
    in_progress: >-
      Exactly one locally authorized item is actively changing repository state
      and is named by current_focus.
    ready: >-
      Dependencies and every recorded item gate are satisfied, so the item is
      dependency-ready at its priority. Ready does not broaden the exact
      owner-authorized mutation boundary of the current run or auto-start a
      successor tranche.
    blocked: >-
      A named owner, evidence, environment, or external boundary prevents the
      item while its safe fallback remains in force.
    deferred: >-
      The item is intentionally postponed with a recorded reason and is not an
      implicit completion or block.
    not_started: >-
      The item has not begun and still has an unfinished dependency or a later
      sequencing position.
  capability_maturity_semantics:
    proposed: accepted direction with no implemented contract or capability
    contracted: a versioned contract exists without implying implementation
    implemented: repository code exists without implying integration or use
    integrated: the capability participates in its declared product graph
    validated: objective checks passed only for their stated scope
    source_activated: an approved originating source may emit governed output
    release_ready: every declared local acceptance condition is satisfied
    published: separately authorized public deployment was verified
  priority_rule: >-
    Within the exact authority of the current run, continue the lowest-numbered
    ready work item whose dependencies are complete. If no ready item lies in
    that boundary, checkpoint with zero in_progress work and record the exact
    next authorization or evidence action. A source-specific block does not stop
    independent authorized ready work.
  readiness_rule: >-
    When every dependency of a not_started item becomes complete, promote it to
    ready in the same ledger update unless it is explicitly blocked or deferred.
  evidence_rule: >-
    Complete items must cite dated repository, test, browser, artifact, or
    primary-source evidence. Add the implementing commit after it exists; use a
    follow-up ledger commit rather than rewriting history to self-reference.
  compaction_rule: >-
    Before a context reset or long pause, update current_focus, next_actions,
    work-item evidence, and blockers so a fresh session can resume without
    reconstructing decisions from chat.

