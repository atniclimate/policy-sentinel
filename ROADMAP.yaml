      Every required outcome must be complete. A source in
      accepted_source_blocks may be complete if its gate later opens, or remain
      blocked with evidence and a truthful public fallback. Publication is
      evaluated separately. During active execution, a required outcome may be
      evidence-blocked while independent ready work proceeds, but it still must
      be complete before the local release candidate can be complete.
    required_outcomes:
