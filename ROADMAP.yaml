  - path: docs/data-governance.md
    role: provenance, association, public/private, and exclusion rules
  - path: docs/architecture.md
    role: current implementation and target engine architecture
  - path: docs/source-coverage.md
    role: coverage and historical-range disclosure model
  - path: docs/ux-spec.md
    role: interaction, accessibility, dossier, and CSV contract
  - path: docs/mvp-plan.md
    role: milestone acceptance and source-by-source validation
  - path: docs/decision-register.md
    role: final decisions, assumptions, blockers, and change control
  - path: docs/source-feasibility.md
    role: dated primary-source evidence and feasibility
  - path: docs/data-contract.md
    role: canonical schema catalog, field contracts, and migration policy
  - path: docs/development/AGENT-AND-TOOL-OPERATING-MODEL.md
    role: work-class staffing, tool routing, leases, evidence, and stop contract
  - path: docs/continuation-prompt.md
    role: Sol Ultra long-running execution handoff
  - path: docs/pnw-scope-and-acceptance.md
    role:
      binding PNW product scope, architecture, authority, and acceptance
      contract
  - path: docs/handoffs/pnw-product-space-rebase-2026-09-02.md
    role:
      product-space reconciliation, legacy mapping, evidence gaps, and first
      tranche
  - path: docs/handoffs/pnw-engine-seams-implementation-launch-2026-09-02.md
    role: exact owner-gated PNW-01 implementation launch contract
  - path: docs/vision/README.md
    role: K0, S0, O0, and D0 custody and status index
  - path: config/taxonomy.v1.json
    role: editable many-to-many policy taxonomy
  - path: config/sources.v1.json
    role: versioned source registry and host policy
  - path: schemas/source.schema.v1.json
    role: source-registry and adapter-configuration contract
  - path: schemas/record.schema.v1.json
    role: normalized record contract
  - path: schemas/artifact.schema.v1.json
    role: static public-artifact contract
  - path: schemas/taxonomy.schema.v1.json
    role: taxonomy configuration contract

authority:
  local_phase_b:
    state: approved
    decided_on: "2026-07-30"
    permits:
      - local implementation under the binding documents
      - synthetic fixtures and ignored local validation artifacts
      - read-only research of public official sources requiring no registration
      - local browser, accessibility, security, and artifact verification
      - local Git commits
  interpretation: >-
    The initial prompt answered all gates. Closed external gates are settled
    constraints, not unanswered questions and not blanket authorization. Record
    affected work as blocked, fail closed, and continue elsewhere.
  approval_model: >-
    External boundaries remain closed as default policies. A later exact owner
    approval changes only a source- or operation-specific gate, with its scope
    and evidence recorded; it never opens every operation in that boundary.
  external_boundaries:
    - id: EXT-GITHUB
      state: closed
      prohibits: >-
        Remote creation or change, push, pull request, Pages, remote Actions
        settings or runs, releases, secrets, and publication. Local workflow
        files and local validation are permitted.
      unblocks_only_when: >-
        The owner explicitly names and approves the exact gh operation and
        publication target.
    - id: EXT-CREDENTIALS
      state: closed
      prohibits: >-
        API or account registration, terms acceptance, keys, tokens, secrets,
        forms, or borrowed credentials.
      unblocks_only_when: >-
        The owner explicitly approves the named source and every applicable
        element of its current terms, operation, registration, and secret
        placement.
    - id: EXT-COST-CONTACT
      state: closed
      prohibits: >-
        Paid or licensed access, charges, subscriptions, and third-party
        contact.
      unblocks_only_when: >-
        The owner explicitly approves the named provider or recipient, terms,
        expected cost, and exact action.
    - id: EXT-PRIVATE
      state: closed
      prohibits: >-
        Private, restricted, Nation-supplied, or land-related data and private
        adapter activation.
      unblocks_only_when: >-
        The supplying or authorizing Tribe and owner approve an exact,
        separately controlled private deployment.
    - id: EXT-AI
      state: closed
      prohibits: optional AI-summary generation or provider calls
      unblocks_only_when: >-
        The owner approves the provider, model, budget, inputs, retention terms,
        and build-only review workflow.
    - id: EXT-NOTIFY
      state: closed
      prohibits: email, text, Slack, webhook, or other outbound notifications
      unblocks_only_when: >-
        The owner approves the recipient, channel, event, content, and workflow.

gates:
  - id: G-A
    name: Phase B local implementation
    state: approved
    evidence:
      - "Owner message on 2026-07-30: Approve to begin Phase B"
  - id: G-K0-LIFECYCLE
    name: Additive local lifecycle contract kernel
    state: approved
    authorized_through: completion
    approved_scope:
      - Additive versioned lifecycle and assertion contracts using synthetic
        fixtures only.
      - Deterministic declared-lossy compatibility projection to PolicyRecord
        1.4.
      - Local schema, semantic, compatibility, replay, and negative-inference
        tests.
      - Independent cooperative and adversarial contract review.
    evidence:
      - >-
        Owner message in the post-R0 implementation session: "Approve both K0
        and S0" subject to K0-first sequencing, synthetic-only inputs, frozen
        shared interfaces, separate checkpoints, and the stated stop conditions.
      - >-
        Owner continuation message: "I authorize Option 1: resume local-only K0
        work from the current dirty worktree." This continuation preserves
        durable commit 21bb68f, prohibits all further network activity, and
        requires S0 to remain not_started and untouched.
  - id: G-S0-SYNTHETIC
    name: Removable synthetic spatial-observation bridge
    state: approved
    authorized_through: completion
    approved_scope:
      - Deliberately impossible synthetic geometries only.
      - Versioned SpatialObservation, SpatialRelation, and separately evidenced
        JurisdictionEvidence contracts.
      - Accessible text and table evidence view without a map.
      - Local deterministic, topology, uncertainty, accessibility, property, and
        semantic non-interference tests.
    evidence:
      - >-
        The same owner message expressly authorizes bounded S0 contract and
        implementation work only after K0 shared provenance and assertion
        interfaces are frozen. Real geometry, providers, maps, uploads,
        persistence, land data, private data, and infrastructure remain closed.
  - id: G-K0-S0-CONVERGENCE
    name: K0 and S0 integration into the existing release scope
    state: closed
    resolution: >-
      K0 and S0 are additive vision phases. Integration into Policy Sentinel's
      existing B2/B4/B5 evidence roots, B9/B10 chain, or local release candidate
      requires a later exact owner convergence decision. Code existence and
      successful synthetic tests do not satisfy or weaken any existing gate.
  - id: G-O0-SYNTHETIC
    name: Fixture-only O0 orchestration contract candidate
    state: approved
    authorized_through: contract_freeze
    approved_scope:
      - >-
        Generalize additive-stage governance, activate O0 contract design, and
        freeze one byte-exact proposed O0 contract candidate using only local
        repository evidence and deliberately synthetic fixture semantics.
      - >-
        Define a removable per-source-revision transaction and custody kernel
        without creating schemas, fixtures, implementation, adapters, source
        access, review, acceptance, convergence, D0, or product integration.
    evidence:
      - >-
        Owner message on 2026-09-01 authorizes only O0 contract design and
        contract freeze through a byte-sealed 1.0.0 candidate, with independent
        review, acceptance, implementation, source work, D0, convergence, and
        every external operation expressly withheld.
      - >-
        Owner message on 2026-09-01 accepts only the terminal disposition
        O0_CONTRACT_REVIEW_FINDINGS_REPAIR_AUTHORIZATION_REQUIRED and authorizes
        the smallest contract-and-governance repair for O0-R01 through O0-R15
        and O0-G01 through O0-G03. It does not accept an O0 contract or
        authorize independent review, implementation, convergence, integration,
        or any external operation.
  - id: G-O0-CONVERGENCE
    name: O0 integration into the existing product or release scope
    state: closed
    resolution: >-
      O0 is an additive vision phase. No required, accepted-source, publication,
      application, pipeline, artifact, B9, B10, or release item may depend on O0
      while this gate is closed. O0 status and evidence cannot change release
      completion or blocker accounting; code or fixture tests do not authorize
      convergence.
  - id: G-B
    name: API terms, registration, and secrets category
    state: closed
    boundary: EXT-CREDENTIALS
    approvable: false
  - id: G-B-GRANTS
    name: Grants.gov API terms and build-time operation
    state: closed
    boundary: EXT-CREDENTIALS
  - id: G-B-CONGRESS
    name: Congress.gov registration and key
    state: closed
    boundary: EXT-CREDENTIALS
  - id: G-B-GOVINFO
    name: GovInfo registration and key
    state: closed
    boundary: EXT-CREDENTIALS
  - id: G-B-REGULATIONS
    name: Regulations.gov registration and key
    state: closed
    boundary: EXT-CREDENTIALS
  - id: G-B-OR-OJD
    name: Oregon Judicial Department access and reuse terms
    state: closed
    boundary: EXT-CREDENTIALS
    resolution: >-
      Reopen only if the owner explicitly approves the exact current Oregon.gov
      and OJD terms, intended noncommercial or commercial use, and any
      third-party OCLC access. Continued access is terms acceptance, so no live
      adapter request or OCLC traversal is authorized while this gate is closed.
  - id: G-B-OR-OARD
    name: Oregon Administrative Rules Database statewide access terms
    state: closed
    boundary: EXT-CREDENTIALS
    resolution: >-
      Reopen only if the owner explicitly approves the exact current Oregon
      statewide terms and named OARD build-time operation. The terms cover sites
      operated or maintained by Oregon executive-department agencies and make
      access acceptance even on OARD's separate hostname. No further request,
      session replay, receipt traversal, or adapter is authorized while closed.
  - id: G-B-OR-GOVERNOR
    name: Oregon Governor executive-order statewide access terms
    state: closed
    boundary: EXT-CREDENTIALS
    resolution: >-
      Reopen only if the owner explicitly approves the exact current Oregon
      statewide terms and named Governor index operation. Approval would not
      spill into OARD or Oregon Legislature OData. No direct index, order-file,
      or adapter request is authorized while closed.
  - id: G-C
    name: Oregon terms
    state: closed
    boundary: EXT-CREDENTIALS
  - id: G-D
    name: Idaho source contract or contact
    state: pending_evidence
    boundary: EXT-COST-CONTACT
    resolution: >-
      Read-only discovery and validation of a stable, permitted, official
      no-registration source satisfies the source-contract path without an owner
      question. If contact is required, EXT-COST-CONTACT remains closed and the
      visible source gap is the accepted fallback.
  - id: G-E
    name: Remote and Pages publication category
    state: closed
    boundary: EXT-GITHUB
    approvable: false
  - id: G-E-LICENSE
    name: Public repository license selection
    state: closed
  - id: G-E-REMOTE-PUSH
    name: GitHub remote creation and initial release-candidate push
    state: closed
    boundary: EXT-GITHUB
  - id: G-E-PAGES
    name: Pages configuration and approved workflow execution
    state: closed
    boundary: EXT-GITHUB
  - id: G-E-PUBLISH
    name: Public beta publication
    state: closed
    boundary: EXT-GITHUB
  - id: G-F
    name: Third-party, licensed, or paid source
    state: closed
    boundary: EXT-COST-CONTACT
  - id: G-G
    name: Private or Nation-supplied material
    state: closed
    boundary: EXT-PRIVATE
  - id: G-H
    name: Optional AI summaries
    state: closed
    boundary: EXT-AI
  - id: G-I
    name: Outbound notification
    state: closed
    boundary: EXT-NOTIFY
  - id: G-J
    name: Source and reuse validation
    state: pending_evidence
    resolution: >-
      Satisfy independently for each enabled source through current primary
      documentation, contract tests, provenance, attribution, and reproduction
      review. This is an evidence gate, not a product interview.
  - id: G-WA-LWS-DISCOVERY
    name: Washington LWS population-discovery contract fit
    state: pending_evidence
    resolution: >-
      Satisfy only when current primary documentation or a separately reviewed
      and explicitly authorized bounded structural observation establishes a
      stable population-enumeration response plus identity, date, official-link,
      range, count/limit, and reconciliation semantics. Do not retry the
      existing legislation_by_year_v1 scenario, loosen the contract from its
      opaque rejection, or substitute synthetic fixtures for live source
      evidence.
  - id: G-WA-REGISTER-FILING-CONTRACT
    name: Washington State Register filing-metadata contract
    state: pending_evidence
    resolution: >-
      Satisfy only when a separately reviewed bounded filing-page observation
      establishes exact heading/title, agency, duplicate reconciliation,
      holdover/Reviser's Note, field-specific date/form/relationship, privacy
      exclusion, official-link, request-count, byte/chunk/concurrency/deadline,
      and whole-refresh semantics. Do not synthesize index-only titles or
      agencies or launch an unbounded filing crawl.
  - id: G-WA-ACCORD-RECORD-MODEL
    name: Washington accord record-model fit
    state: satisfied
    resolution: >-
      Satisfy only when a versioned contract preserves exact executing parties
      and signatory roles, an executed or signed date, narrative source-status
      evidence, reviewed supersession state and typed edges, fallback instrument
      identity, and metadata-only landmark evidence with reproduction
      validation. Do not relabel parties as issuing bodies, convert execution
      into publication or effectiveness, invent current status or complete
      history, copy source text merely to satisfy landmark schema, or create a
       Nation association before exact signatory evidence reconciles to the
      approved BIA identity registry.
    evidence:
      - >-
        Record and artifact schema 1.4.0 plus source-registry schema 1.18.0
        preserve Accord parties and source roles, signed or executed events,
        narrative status review, scoped supersession review, source-provided or
        project-fallback identity, and metadata-only landmark evidence without
        coercing those meanings into generic issuing-body, status, or date
        fields.
      - >-
        The fictional synthetic-state-accord fixture and negative contract,
        semantic, pipeline, artifact-integrity, last-known-good, client-parser,
        search, date, details, dossier, CSV, accessibility, keyboard, and
        tampering tests exercise the model without creating a real Nation
        association or retaining provider text.
      - >-
        On 2026-08-03, npm test passed all 45 files and 694 tests; type
        checking, lint, production build, and artifact validation also passed at
        3 synthetic records, 575 synthetic Nations, and 8 verified assets. The
        real GOIA source remained disabled with adapter null.
  - id: G-WA-APPELLATE-CITATION-REVISION-CONTRACT
    name: Washington appellate citation and current-version contract
    state: pending_evidence
    resolution: >-
      Satisfy only when originating evidence supplies an exact official citation
      separate from the docket and a privacy-safe, case-specific current-version
      and typed revision relationship, or a deliberate versioned record/UI
      contract permits citationless slip decisions. Do not repair RSS dockets,
      relabel a docket or filename as a citation, fetch information sheets or
      PDFs, or use the external reporter as an opaque supplement.
  - id: G-DOI-IBIA-DOCUMENT-CONTRACT
    name: DOI IBIA document access, privacy, and decision-status contract
    state: pending_evidence
    resolution: >-
      Satisfy only when current originating evidence provides a crawlable exact
      document contract plus docket, document form, disposition,
      reconsideration, supersession, judicial-review, chronology-completeness,
      privacy-selection, and official-link semantics. Do not automate the
      robots-disallowed OHA search or decision hosts, infer current or binding
      status from the chronology, or ingest personal, probate, land, mineral,
      ownership, or governance-dispute content.
  - id: G-ID-APPELLATE-CITATION-FINALITY-CONTRACT
    name: Idaho appellate citation, finality, and revision contract
    state: pending_evidence
    resolution: >-
      Satisfy only when originating evidence supplies an exact per-record
      citation, remittitur/finality state, typed amendment or substitution
      relationships, a permitted bounded inventory contract, and a privacy-safe
      selection rule. Do not infer judicial status from CMS tags or filenames,
      fetch staff summaries or PDFs, or use third-party contact without exact
      owner approval.
  - id: G-BIA-IDENTITY
    name: Current BIA recognition identity reconciliation
    state: pending_evidence
    resolution: >-
      Current originating BIA evidence must provide an unambiguous row-level
      reconciliation from the 577 displayed list-entry paragraphs to the
      notice's stated 575 entities, and that mapping must pass two independent
      reviews. Arithmetic, TLD rows, grouping assumptions, aliases, geography,
      or third-party contact cannot substitute for exact official evidence.
  - id: G-RC
    name: Local release-candidate acceptance
    state: pending_evidence
    resolution: >-
      All locally executable required items and release checks pass; blocked
      sources and external publication remain visibly disclosed.
  - id: G-LOCAL-BROWSER
    name: Built-app browser evidence
    state: pending_evidence
    resolution: >-
      Satisfy when the in-app Browser backend is available and the required
      desktop and mobile built-artifact interaction, accessibility, and
      same-origin network smoke passes. This is an environment evidence gate,
      not an authorization or owner-approval gate.
    evidence:
      - >-
        On 2026-08-03, the required in-app Browser runtime was initialized and
        its documented discovery troubleshooting was followed; the available
        browser list was still empty. No alternate browser surface was used as
        substitute acceptance evidence.
      - >-
        On 2026-09-01, the exact in-app Browser selector was unavailable after
        the documented discovery troubleshooting. The only listed backend was an
        unrelated Brave extension, which was not substituted for acceptance
        evidence. G-LOCAL-BROWSER therefore remains pending.
  - id: G-PNW-IMPLEMENTATION
    name: First PNW engine-seam implementation tranche
    state: approved
    authorized_through: completion
    approved_scope:
      - >-
        Implement exactly PNW-01-ENGINE-SEAMS under the current launch handoff,
        using only its twelve allowed paths, synthetic fixtures, required tests,
        stop conditions, and no-other-gate boundary.
    evidence:
      - |-
        Owner message on 2026-09-02: I Authorize exactly PNW-01-ENGINE-SEAMS under docs/handoffs/pnw-engine-seams-implementation-launch-2026-09-02.md, including its allowed paths, tests, stop conditions, and no other gate or action.
    resolution: >-
      Open only when the owner explicitly authorizes the exact synthetic
      PNW-01-ENGINE-SEAMS tranche recorded in
      docs/handoffs/pnw-engine-seams-implementation-launch-2026-09-02.md. The
      packet, product-space mapping, and repository alignment are direction and
      design evidence, not product-code implementation authority.
  - id: G-PNW-ATNI-59-ROSTER
    name: Current authoritative ATNI 59-member roster
    state: pending_evidence
    resolution: >-
      Satisfy only when a current ATNI-authorized originating source identifies
      the exact intended 59 Member Tribes and those membership assertions are
      reconciled to separately verified sovereign identities. Do not derive the
      roster by scraping and subtracting, geography, federal recognition, names,
      or owner-direction arithmetic.
  - id: G-PNW-COMMUNITY-AUTHORITY
    name: Per-deployment community authority
    state: closed
    resolution: >-
      Open only for an exact deployment whose community profile, terminology,
      rights-frame sources, geography, visibility, reviewers, and output uses
      are authorized or explicitly bounded as a synthetic candidate.
  - id: G-PNW-SPATIAL-EVIDENCE
    name: Per-relation PNW spatial evidence and custody
    state: pending_evidence
    resolution: >-
      Satisfy relation by relation only with permitted authoritative evidence,
      custody, review, temporal scope, sensitivity, visibility, and explicit
      allowed and forbidden inference semantics. S0 remains isolated behind its
      closed convergence gate.
  - id: G-PNW-SOURCE-ACTIVATION
    name: Per-source PNW activation contract
    state: closed
    resolution: >-
      Open only for a named source after its current primary documentation,
      terms, credentials, transport, schema, identity, coverage, lifecycle,
      health, privacy, reproduction, and last-known-good requirements pass and
      the exact activation is approved.
  - id: G-PNW-OUTPUT-REVIEW
    name: Per-output human review
    state: pending_evidence
    resolution: >-
      Satisfy artifact by artifact only when designated reviewers accept the
      citations, evidence, coverage, visibility, limitations, and generated
      legal, advocacy, grant, technical, executive, or public prose represented
      as reviewed output.

