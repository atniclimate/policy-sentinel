      - Every alias is authorized by a cited official source.
      - Redirect, merge, grouping, and retirement behavior is versioned and
        tested.
      - Search never uses unofficial, inferred, address-derived, or
        geography-derived aliases.
    evidence: []

  - id: B2-STATES
    priority: 23
    milestone: B2
    title: Official Nation-to-state coverage crosswalk
    status: not_started
    dependencies:
