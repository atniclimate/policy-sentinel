risks:
  - id: R-NATION
    severity: critical
    risk:
      An inferred or unstable Nation association could misrepresent a Nation.
    control: >-
      Exact official evidence and URL, independent review, stable-ID history,
      fail-closed state coverage, and regression tests.
  - id: R-TERMS
    severity: critical
    risk:
      Public availability could be mistaken for permission to copy full text.
    control: >-
      Source-specific terms and reproduction review; citation, permitted short
      excerpt, and official link when rights are absent or unclear.
  - id: R-COVERAGE
    severity: high
    risk: Partial or stale sources could appear comprehensive or current.
    control: >-
      Source-specific date ranges, health, data-as-of, stale/degraded labels,
      checked last-known-good assets, and explicit gaps.
  - id: R-CATEGORY
    severity: high
    risk:
      Keyword or AI classification could create unsupported public categories.
    control: >-
      Exact official-label mappings only, mapping provenance, many-to-many
      configuration, and Unclassified fallback.
  - id: R-STATIC-SCALE
    severity: medium
    risk: Index, details, or search may exceed practical static-page budgets.
    control: >-
      Measure representative scale before adding a service; preserve compact
      index and on-demand detail shards.
  - id: R-SECRETS
    severity: critical
    risk:
      Credentials, raw responses, private material, or land data could enter Git
      or assets.
    control: >-
      Closed credential/private gates, ignored staging, allowlists, source and
      artifact scans, synthetic fixtures, and adversarial release review.
  - id: R-AGENT-DRIFT
    severity: high
    risk:
      A long-running agent could reopen settled decisions or overstate progress.
    control: >-
      Mandatory startup reads, this ledger, evidence-based status, focused local
      commits, cooperative/adversarial review, and compaction updates.

next_actions:
  - order: 1
    work_item: B6-COURT-EXPANSION
    action: >-
      Assess Washington, Oregon, and Idaho official appellate-opinion indexes
      independently against current primary documentation, robots/access
      rules, exact identity/date/status fields, reproduction limits, privacy
      exposure, historical range, and bounded build-time failure behavior.
      Implement only a source-specific metadata-and-link increment whose
      contract passes without a credential, body crawl, or inferred Nation
      relationship.
  - order: 2
    work_item: B6-COURT-EXPANSION
    action: >-
      Assess any broader Supreme Court increment separately from the validated
      one-row pilot. Keep DOI IBIA behind G-DOI-IBIA-DOCUMENT-CONTRACT and
      GovInfo USCOURTS behind G-B-GOVINFO; record source-specific gaps instead
      of turning selected records into comprehensive coverage claims.
  - order: 3
    work_item: B6-LANDMARKS
    action: >-
      After independent court increments finish, evaluate only source-verified
      landmark candidates with exact official evidence, metadata-compatible
      reproduction rights, and the documented pre-1980 boundary. Do not infer
      Boldt, Accord, Nation, rights, land, or legal-effect facts.

finish_states:
  local_release_candidate:
    current_state: in_progress
    satisfied_when:
      - All locally executable required work items through B10-RC are complete.
      - Every unavailable source is blocked with evidence and a truthful
        fallback.
      - G-RC is satisfied by integrated test, browser, security, artifact, and
        review evidence.
      - The worktree is clean and no generated live data or local service
        remains.
    does_not_mean:
      - public beta published
      - comprehensive legal or source coverage
      - any closed external gate is approved
  public_beta:
    current_state: blocked
    blocked_by:
      - RELEASE-PUBLISH
      - G-E-PUBLISH
    satisfied_when:
      - The owner explicitly authorizes the exact GitHub and Pages operations.
      - Those operations are performed with gh from an accepted local release
        candidate.
      - Deployment verification passes and public limitations remain visible.

handoff_report_contract:
  required_fields:
    - completed work items and evidence
    - remaining ready, blocked, deferred, and not-started items
    - primary-source and reproduction gaps
    - exact commands and real outcomes
    - browser, accessibility, privacy, security, and artifact findings
    - local commit SHAs
    - git status
    - closed boundary between local readiness and external publication
  forbidden_claims:
    - Policy Sentinel is complete because plans or fixtures exist.
    - A blocked source is covered.
    - A local release candidate is a published beta.
    - An inferred Nation relationship is source-explicit.
