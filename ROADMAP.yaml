  - id: B8-ID-RULES
    priority: 90
    milestone: B8
    title: Idaho official rules and executive-source feasibility
    status: ready
    dependencies:
      - B3-PIPELINE
    acceptance:
      - Sources independent of the unresolved legislative interface are
        assessed.
      - Enabled sources have official contracts, terms, history, health, and
        truthful limitations.
      - No legislative scraping is disguised as structured coverage.
    evidence: []

  - id: B8-ID-RULES-ADAPTER
    priority: 91
    milestone: B8
    title: Idaho rule or executive adapter
    status: not_started
    dependencies:
      - B8-ID-RULES
    acceptance:
      - Each viable official source has its own build-time adapter, contract,
        date range, provenance, health, reproduction policy, and failure tests.
      - Rule/order identifiers, agency, stage/status, dates, corrections, and
        official links remain source-exact.
      - If no source is viable, the work item closes only with dated evidence
        and a visible source-specific gap, not legislative scraping.
    evidence: []

  - id: B8-ID-LEGISLATION
    priority: 92
    milestone: B8
    title: Idaho structured legislative adapter
    status: blocked
    dependencies:
      - B3-PIPELINE
    blocked_by:
      - G-D
    authorization_gate: G-D
    acceptance:
      - The official source owner, endpoint, schema, terms, cadence, limits,
        history, and failure behavior are documented.
      - Live samples pass identifiers, sessions, sponsors, committees, actions,
        status, text-link, provenance, and health tests.
      - Layout-dependent HTML scraping is not the primary contract.
    safe_fallback: >-
      Keep a visible legislative automation gap and link to official session
      sources without claiming record coverage.
    unblocks_only_when: >-
      A stable permitted official structured contract is found through read-only
      research, or the owner approves a specific inquiry and the resulting
      contract passes review.
    evidence:
      - "docs/source-feasibility.md and docs/decision-register.md blocker B-002."

  - id: B9-LONGTAIL
    priority: 100
    milestone: B9
    title: Controlled long-tail source pilots
    status: not_started
    dependencies:
      - B4-FR-UX
      - B5-WA-RULES
      - B5-WA-ACCORDS
      - B6-COURT-EXPANSION
      - B6-LANDMARKS
      - B7-OR-ADAPTER
      - B8-ID-RULES-ADAPTER
    acceptance:
      - At least one reviewable source set supports each locally viable
        remaining record class.
      - Official Tribal documents are officially published and have
        correction/removal handling.
      - County records have final/public status and exact Nation-name evidence.
      - Agreements distinguish signed, draft, superseded, and current status.
      - Private agreements, municipal records, land data, and unclear reuse
        remain excluded.
    evidence: []

  - id: B10-SINGLE-NATION
    priority: 110
    milestone: B10
    title: Production-data single-Nation acceptance suite
    status: not_started
    dependencies:
      - B2-READY
      - B9-LONGTAIL
    acceptance:
      - All three entry points, filters, global search, Unclassified, details,
        history, selection, dossier, and CSV pass.
      - Outside-Washington/Oregon/Idaho Nations receive federal-only results and
        a clear state notice.
      - Associations and taxonomy never change because of UI mode or query text.
      - Keyboard, native fallback, screen-reader, zoom/reflow, contrast, focus,
        responsive, and print checks pass.
    evidence: []

  - id: B10-COMPARISON
    priority: 111
    milestone: B10
    title: Explicit advanced comparison mode
    status: not_started
    dependencies:
      - B10-SINGLE-NATION
    acceptance:
      - Comparison is opt-in and never replaces the default single-Nation flow.
      - It uses the same source-explicit relationships and general-jurisdiction
        labels.
      - It does not infer similarity, legal effect, eligibility, or
        comprehensive Nation interests.
      - Accessibility, state, URL/history, dossier, and CSV regression tests
        pass.
    evidence: []

  - id: B10-RULES-SCALE
    priority: 112
    milestone: B10
    title: Representative scale budgets and deterministic change rules
    status: not_started
    dependencies:
      - B9-LONGTAIL
    acceptance:
      - A public-safe representative multi-source corpus defines expected record
        count, compact-index size, detail-shard distribution, and search/filter
        workload without committing generated production data.
      - Measured budgets and pass/fail thresholds cover initial load, index
        transfer, detail fetch, search/filter latency, memory, and print/CSV
        selection scale before any new service or dependency is proposed.
      - New and changed badges compare documented source IDs, exact
        source-derived fields, prior validated manifests, and source update
        semantics deterministically.
      - Urgent alerts use documented source status/deadline fields, time zones,
        thresholds, and expiry rules, with no AI or inferred urgency.
      - Normal, unchanged, amended, corrected, withdrawn, deadline-boundary,
        missing-time-zone, and source-failure cases have regression tests.
      - Decision-register items O-002 and O-003 are resolved or updated with
        measured evidence and remaining limits.
    evidence: []

  - id: B10-REFRESH
    priority: 113
    milestone: B10
    title: Weekly and manual refresh workflow, locally exercised
    status: not_started
    dependencies:
      - B10-RULES-SCALE
    acceptance:
      - Scheduled cadence is weekly and manual workflow_dispatch is defined.
      - Each source stages, validates, compares, and promotes independently.
      - Failed sources retain checksum-verified prior shards and original
        data-as-of dates.
      - Health, stale/degraded/unavailable state, new/changed badges, and exact
        urgent alerts agree with manifests.
      - Workflow configuration is tested locally without remote creation,
        secrets, Actions execution, or publication.
    evidence: []

  - id: B10-RC
    priority: 114
    milestone: B10
    title: Local release-candidate hardening
    status: not_started
    dependencies:
      - B10-COMPARISON
      - B10-REFRESH
      - B4-CONGRESS-CONTRACT
      - B4-GOVINFO-CONTRACT
      - B4-REGS-CONTRACT
      - B7-OR-ODATA-CONTRACT
    acceptance:
      - Full checks, source-specific suites, browser tests, and artifact
        validation pass.
      - Asset inventory, hashes, source maps, logs, and tracked files contain no
        prohibited material.
      - Dependency vulnerability and license review pass or document accepted
        local constraints.
      - CSV formula, encoding, quoting, and repeated-field tests pass.
      - Print dossier includes criteria, generated/data-as-of times, sources,
        health, limitations, alerts, exact permitted language, and disclaimer.
      - Network inspection shows only same-origin static asset requests during
        ordinary use.
      - Cooperative and adversarial release reviews have no unresolved
        high-severity findings.
      - G-RC changes to satisfied and blocked source/publication gaps remain
        visible.
    evidence: []

  - id: RELEASE-LICENSE
    priority: 200
    milestone: External publication
    title: Record the owner-selected public repository license
    status: blocked
    dependencies:
      - B10-RC
    blocked_by:
      - G-E-LICENSE
    authorization_gate: G-E-LICENSE
    acceptance:
      - The owner selects the exact license or expressly chooses no license.
      - LICENSE, README, package metadata, attribution, and third-party notices
        agree with that decision.
      - Dependency and source-content rights are reviewed separately from the
        repository license.
    safe_fallback: >-
      Keep the local release candidate private and retain decision-register item
      O-011 as open.
    unblocks_only_when: >-
      The owner explicitly selects the public repository license or expressly
      chooses no license.
    evidence:
      - "docs/decision-register.md item O-011 requires owner selection before
        publication."

  - id: RELEASE-REMOTE-PUSH
    priority: 201
    milestone: External publication
    title: Create the approved GitHub remote and push the accepted history
    status: blocked
    dependencies:
      - RELEASE-LICENSE
    blocked_by:
      - G-E-REMOTE-PUSH
    authorization_gate: G-E-REMOTE-PUSH
    acceptance:
      - gh auth status succeeds in the intended account.
      - The exact owner, repository name, visibility, description, and default
        branch match the owner's scoped approval.
      - The exact accepted local commit and branch are recorded before push.
      - Tracked content, history, remote, and branch protection assumptions are
        rechecked.
      - The remote and initial non-force push use the approved gh operation and
        are inspected with gh; no Pages change occurs in this item.
    safe_fallback: Preserve the local repository with no remote or push.
    unblocks_only_when: >-
      The owner explicitly approves the named account, repository, visibility,
      branch, accepted commit, and combined gh remote-and-push operation.
    evidence:
      - "The initial prompt expressly withheld remote creation and push
        approval."

  - id: RELEASE-PAGES
    priority: 202
    milestone: External publication
    title: Configure the approved GitHub Pages target
    status: blocked
    dependencies:
      - RELEASE-REMOTE-PUSH
    blocked_by:
      - G-E-PAGES
    authorization_gate: G-E-PAGES
    acceptance:
      - The exact repository, Pages build source, workflow, branch, permissions,
        and any approved Actions secrets are named.
      - Configuration and inspection use gh only.
      - No deployment workflow is dispatched under this item unless the same
        approval expressly includes that production deployment.
    safe_fallback: Leave Pages disabled and the remote repository undeployed.
    unblocks_only_when: >-
      The owner explicitly approves the exact Pages settings, workflow,
      permissions, and any named secret operations.
    evidence:
      - "The initial prompt expressly withheld Pages and Actions changes."

  - id: RELEASE-PUBLISH
    priority: 203
    milestone: External publication
    title: Deploy and verify the public Pages beta
    status: blocked
    dependencies:
      - RELEASE-PAGES
    blocked_by:
      - G-E-PUBLISH
    authorization_gate: G-E-PUBLISH
    acceptance:
      - The owner explicitly identifies the accepted commit, workflow, and
        production deployment operation.
      - The deployment is run and inspected with gh only.
      - Deployment health, assets, source coverage, limitations, and public URL
        are verified after publication.
      - The public-beta state changes to complete only after production
        verification passes.
    safe_fallback: >-
      Preserve the configured but undeployed project and the accepted local
      release candidate.
    unblocks_only_when: >-
      The owner explicitly approves the exact production deployment and public
      beta publication operation.
    evidence:
      - "The initial prompt expressly withheld deployment and publication
        approval."

