risks:
  - id: R-NATION
    severity: critical
    risk:
      An inferred or unstable Nation association could misrepresent a Nation.
    control: >-
      Exact official evidence and URL, independent review, stable-ID history,
      fail-closed state coverage, and regression tests.
  - id: R-TERMS
    severity: critical
    risk:
      Public availability could be mistaken for permission to copy full text.
    control: >-
      Source-specific terms and reproduction review; citation, permitted short
      excerpt, and official link when rights are absent or unclear.
  - id: R-COVERAGE
    severity: high
    risk: Partial or stale sources could appear comprehensive or current.
    control: >-
      Source-specific date ranges, health, data-as-of, stale/degraded labels,
      checked last-known-good assets, and explicit gaps.
  - id: R-CATEGORY
    severity: high
    risk:
      Keyword or AI classification could create unsupported public categories.
    control: >-
      Exact official-label mappings only, mapping provenance, many-to-many
      configuration, and Unclassified fallback.
  - id: R-STATIC-SCALE
    severity: medium
    risk: Index, details, or search may exceed practical static-page budgets.
    control: >-
      Measure representative scale before adding a service; preserve compact
      index and on-demand detail shards.
  - id: R-SECRETS
    severity: critical
    risk:
      Credentials, raw responses, private material, or land data could enter Git
      or assets.
    control: >-
      Closed credential/private gates, ignored staging, allowlists, source and
      artifact scans, synthetic fixtures, and adversarial release review.
  - id: R-AGENT-DRIFT
    severity: high
    risk:
      A long-running agent could reopen settled decisions or overstate progress.
    control: >-
      Mandatory startup reads, this ledger, evidence-based status, focused local
      commits, cooperative/adversarial review, and compaction updates.
  - id: R-PNW-ROSTER
    severity: critical
    risk: >-
      Owner direction, recognition evidence, or a scraped public directory could
      be misrepresented as the authoritative current ATNI 59-member roster.
    control: >-
      Keep recognition and organization membership separate; require a current
      ATNI-authorized originating roster plus separately evidenced sovereign
      identities; fail closed without it.
  - id: R-PNW-AUTHORITY
    severity: critical
    risk: >-
      Geography, keywords, organization priorities, relevance, or a useful
      summary could silently become a claim of Nation authority, legal
      applicability, rights impact, jurisdiction, or community position.
    control: >-
      Typed evidence-bearing assertions, authority and review fields, explicit
      non-claims, deterministic rules, no inferred identity or association, and
      sovereignty-focused adversarial review.
  - id: R-PNW-OUTPUT-DRIFT
    severity: high
    risk: >-
      Document, web-module, application, and structured-output adapters could
