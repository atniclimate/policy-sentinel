    acceptance:
      - State coverage uses cited official roster evidence, never address,
        geometry, territory, maps, or land.
      - Washington, Oregon, and Idaho inclusion is independently reviewed.
      - Unresolved entries remain federal-only with a visible notice.
      - The crosswalk contains no contact, location, or sensitive land data.
    evidence: []

  - id: B2-READY
    priority: 24
    milestone: B2
    title: Nation registry publication readiness
    status: not_started
    dependencies:
