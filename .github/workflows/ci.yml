name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: legacy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and development dependencies
        run: |
          uv venv --python 3.12
          uv pip install --group dev -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and development dependencies
        run: |
          uv venv --python 3.12
          uv pip install --group dev -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and development dependencies
        run: |
          uv venv --python 3.12
          uv pip install --group dev -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Pytest
        run: pytest
