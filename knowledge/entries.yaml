        section: Analytical and output acceptance
        observed_line: 140
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:R02
    kind: research_question
    title:
      How do participation and review procedures relate to environmental
      governance?
    summary:
      Connect careful coding of policy procedures with separately supported
      questions about participation and political or environmental conditions.
    evidence_maturity: unproven_research_question
    observed_scope:
      The memo and synthetic scenario manifests offer motivating cases,
      including flood governance and clean-energy siting.
    limits:
      - Procedural text does not establish lived experience, motives, consent,
        impacts or causation.
      - Current scenarios do not supply accepted real identity evidence.
      - Community-specific research, additional data and contact would need
        their own agreed research and governance scope.
    proposed_reuse:
      A future mixed-methods research protocol co-designed around an explicit
      question and appropriate contextual evidence.
    tags:
      - political-ecology
      - participation
      - research-design
    sources:
      - document: policy-sentinel:document:research
        section: Research that changes the design
        observed_line: 82
      - document: policy-sentinel:document:candidates
        section: PS09-SC-A — Nooksack-Sumas/Whatcom flood and water governance
        observed_line: 55
      - document: policy-sentinel:document:candidates
        section: PS09-SC-B — Washington clean-energy siting
        observed_line: 79
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:G01
    kind: governance_method
    title: Keep identity and authority relationships distinct
    summary:
      Represent recognition, membership, cohort selection, issuer, speaker,
      association and jurisdiction as different evidence-bearing relationships.
    evidence_maturity: reported_synthetic_contracts_real_acceptance_unresolved
    observed_scope:
      Run 2 synthetic identity contracts and PNW-04 taxonomy contracts implement
      the distinctions; candidate manifests record unresolved real-evidence
      requirements.
    limits:
      - Recognition is not organization membership.
      - A taxonomy crosswalk is not transitive legal or institutional
        equivalence.
      - Unmapped and unassessed are different states; keyword association is not
        Nation evidence.
    proposed_reuse:
      A typed relationship discipline for federated research catalogs without
      inferring authority from graph proximity.
    tags:
      - sovereignty
      - identity
      - knowledge-organization
    sources:
      - document: policy-sentinel:document:adr
        section: Decision and evidence boundary
        observed_line: 17
      - document: policy-sentinel:document:candidates
        section: Shared slot and evidence contract
        observed_line: 14
      - document: policy-sentinel:document:taxonomy-journal
        section: Frozen input model
        observed_line: 86
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:D01
    kind: developer_lesson
    title: Scope dependencies to the claims they constrain
    summary:
      Separate a missing prerequisite for one claim or release gate from
      unrelated work that can be qualified independently.
    evidence_maturity: recorded_architectural_correction
    observed_scope:
      The strategic correction and corpus ADR consolidate parallel release
      accounting and permit general-jurisdiction work within its adopted scope.
    limits:
      - This does not waive real identity or integrated release prerequisites.
      - Archived ready work is not a new execution grant.
    proposed_reuse:
      Dependency graphs with explicit claim scope and a single release root.
    tags:
      - architecture
      - dependency-design
      - negative-results
    sources:
      - document: policy-sentinel:document:research
        section: What failed, and what remains sound
        observed_line: 38
      - document: policy-sentinel:document:adr
        section: Decision and evidence boundary
        observed_line: 17
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:D02
    kind: developer_lesson
    title: Exercise the actual process-launch boundary
    summary:
      Test the real shell, argument transport, exit behavior and invocation
      shape before treating helper checks as end-to-end evidence.
    evidence_maturity: recorded_failed_launch_and_successor_design
    observed_scope:
      The recovery record describes 43 passing helper checks followed by a
      persistent-stdin launch failure and zero source operations; it proposes an
      explicit argv-based successor.
    limits:
      - This was a local execution failure, not evidence that a provider refused
        access.
      - The retired run remains immutable and cannot be resumed through this
        lesson.
    proposed_reuse:
      A minimal real-launch smoke check for automation that crosses shell or
      process boundaries.
    tags:
      - runtime
      - negative-results
      - validation
    sources:
      - document: policy-sentinel:document:recovery
        section: What failed, and what did not
        observed_line: 95
      - document: policy-sentinel:document:recovery
        section: Original local launch evidence (2026-09-04)
        observed_line: 118
      - document: policy-sentinel:document:recovery
        section: Recommended execution design for a new packet
        observed_line: 155
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:D03
    kind: developer_method
    title: Use bounded leases and finite review findings
    summary:
      Give each worker an owned scope, evidence obligations and stop contract;
      reconcile a finite findings list at checkpoints.
    evidence_maturity: documented_operating_practice
    observed_scope:
      The operating model and four run templates already encode reusable
      patterns for this repository.
    limits:
      - The history does not experimentally establish productivity gains over
        another workflow.
      - The operating model organizes work; it does not authorize it.
    proposed_reuse:
      Extract a small project-neutral operating template after a second project
      pilot.
    tags:
      - agent-workflows
      - handoffs
      - repository-management
    sources:
