entries:
  - id: policy-sentinel:knowledge:M01
    kind: method
    title: Trace outputs through immutable source identities
    summary:
      Connect an output claim to its analysis, citation, segment, rendition and
      captured object instead of retaining only a URL.
    evidence_maturity: reported_bounded_implementation
    observed_scope:
      The local evaluation reports parity across 43 cited quotations, 11
      relations, 9 analyses and 3 findings. These are bounded output checks, not
      a corpus-wide accuracy rate.
    limits:
      - A checksum establishes byte identity, not semantic truth or reuse
        permission.
      - The organization catalog points to repository evidence; it does not copy
        the external corpus.
    proposed_reuse:
      An evidence-chain pattern for archives, research software and reproducible
      reports.
    tags:
      - provenance
      - reproducibility
      - data-science
    sources:
      - document: policy-sentinel:document:adr
        section: Minimal object, identity and citation spine
        observed_line: 66
      - document: policy-sentinel:document:evaluation
        section: Final expanded discovery regression
        observed_line: 471
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:M02
    kind: method
    title: Keep publication, effective, version and capture dates separate
    summary:
      Represent different source clocks explicitly and retain unknown dates
      rather than inventing a single policy date.
    evidence_maturity: reported_bounded_implementation
    observed_scope:
      The evaluation fixes time-sensitive expectations and records a
      future-evidence leakage repair.
    limits:
      - A date filter cannot determine legal applicability.
      - A later capture can contain an earlier text; each temporal claim needs
        its own field provenance.
    proposed_reuse:
      Temporal dataset and as-of query design, with explicit leakage tests.
    tags:
      - temporal-analysis
      - provenance
      - evaluation
    sources:
      - document: policy-sentinel:document:research
        section:
          A system that can learn without making its conclusions authoritative
        observed_line: 152
      - document: policy-sentinel:document:evaluation
        section: Fixed practical thresholds
        observed_line: 109
      - document: policy-sentinel:document:evaluation
        section: Recorded first pass, 2026-09-05
        observed_line: 204
      - document: policy-sentinel:document:evaluation
        section: Independent analytical operation evidence
        observed_line: 343
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:M03
    kind: method
    title: Distinguish text correspondence from provision identity
    summary:
      Use an explicit text-matching rule and leave unmatched units unaligned
      when the evidence does not establish provision identity.
    evidence_maturity: reported_repair_with_limits
    observed_scope:
      After rejecting ordinal pairing, the recorded method
      unique-text-occurrence-comparison, version 2.0.0, paired 76 exact or
      whitespace-normalized units.
    limits:
      - Unaligned does not mean added or repealed.
      - Textual correspondence does not establish unchanged legal effect or a
        stable legal provision identity.
    proposed_reuse:
      A conservative change-analysis method with an auditable matching rule and
      unmatched cases.
    tags:
      - temporal-analysis
      - text-comparison
      - negative-results
    sources:
      - document: policy-sentinel:document:evaluation
        section: Independent analytical operation evidence
        observed_line: 343
      - document: policy-sentinel:document:outcome
        section: Demonstrations using retained identities
        observed_line: 185
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:M04
    kind: method
    title: Expose uncoded cells in institutional comparisons
    summary:
      Record the coding rule and supporting text while preserving not-coded and
      unknown states in a comparison matrix.
    evidence_maturity: reported_small_sample_analysis
    observed_scope:
      "The recorded comparison covers 9 versions and 10 dimensions: 90 cells,
      including 47 not_coded_unknown cells."
    limits:
      - No inter-coder reliability or expert-validity study is established by
        this run.
      - The matrix does not establish government equivalence, policy quality or
        experienced outcomes.
    proposed_reuse:
      A pilot coding protocol for a future institutional or political-ecology
      methods study.
    tags:
      - institutional-analysis
      - missingness
      - research-methods
    sources:
      - document: policy-sentinel:document:evaluation
        section: Independent analytical operation evidence
        observed_line: 343
      - document: policy-sentinel:document:research
        section: Research that changes the design
        observed_line: 82
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:M05
    kind: method
    title: Freeze expectations and preserve first-pass failures
    summary:
      Keep predeclared questions, original scores, repairs and later regression
      results distinguishable.
    evidence_maturity: reported_evaluation_practice
    observed_scope:
      The protocol records 18 questions, 7 multi-document tasks, 4 unsupported
      questions and 4 reserved cases. Required supporting spans recovered in the
      pooled top 20 were 19/27 initially and 25/27 after repair, with 2 misses
      remaining.
    limits:
      - Reserved cases disclosed for repair are no longer held out.
      - The shared workspace was not a secure blind benchmark.
      - Purposeful sampling and repair on the same tasks do not establish
        general search performance.
    proposed_reuse:
      Evaluation diaries that preserve negative findings and prevent
      retrospective success claims.
    tags:
      - evaluation
      - negative-results
      - reproducibility
    sources:
      - document: policy-sentinel:document:evaluation
        section: Independent evidence freeze
        observed_line: 37
      - document: policy-sentinel:document:evaluation
        section: Recorded first pass, 2026-09-05
        observed_line: 204
      - document: policy-sentinel:document:evaluation
        section: Passing search regression and omission metadata repair
        observed_line: 390
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:M06
    kind: method
    title: Audit omission disclosure separately from quotation integrity
    summary:
      A correctly copied quotation can still be misleading if the system fails
      to disclose excluded context.
    evidence_maturity: reported_metadata_repair
    observed_scope:
      The evaluation records omitted-context metadata repair involving 5
      renditions and 6 locators, with preserved prior evidence and unchanged
      question ranking and score observations.
    limits:
      - Disclosure repair is not restoration of all excluded source context.
      - Integrity and completeness need distinct acceptance questions.
    proposed_reuse:
      A checklist for evidence excerpts and retrieval systems that make scope
      limitations inspectable.
    tags:
      - provenance
      - omissions
      - evaluation
    sources:
      - document: policy-sentinel:document:evaluation
        section: Passing search regression and omission metadata repair
        observed_line: 390
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:M07
    kind: method
    title: Preserve sampling denominators and exclusions
    summary:
      Carry the sampled population, selection method, gaps and exclusions
      alongside findings.
    evidence_maturity: reported_bounded_corpus_evidence
    observed_scope:
      The bounded local outcome reports 210 works, 215 versions and 21,209
      segments; the three retained findings (two provisional and one null) do
      not silently expand to cover that entire population.
    limits:
      - The Washington chapter selection is bounded and ordered, with recorded
        gaps and filtering.
      - Healthy source operation does not establish comprehensive coverage.
    proposed_reuse:
      A dataset scope statement and denominator record for future papers and
      product explanations.
    tags:
      - sampling
      - coverage
      - data-science
    sources:
      - document: policy-sentinel:document:outcome
        section: Corpus and coverage
        observed_line: 212
      - document: policy-sentinel:document:evaluation
        section: Corpus and scenario selection
        observed_line: 15
