  - id: policy-sentinel:knowledge:X02
    kind: experimental_method
    title: Use impossible fixtures and prove removability
    summary:
      Exercise schema and boundary behavior using deliberately impossible
      synthetic cases, then verify that removing the experiment leaves the main
      product intact.
    evidence_maturity: isolated_synthetic_experiment_not_converged
    observed_scope:
      The S0 report records impossible-fixture-only contracts, bounded property
      checks and non-interference/removal evidence.
    limits:
      - This establishes no real GIS fitness or authorization for maps, land or
        geometry in the product.
      - The experiment remains isolated behind its convergence gate.
    proposed_reuse:
      A testing pattern for sensitive or speculative components before any
      real-data integration.
    tags:
