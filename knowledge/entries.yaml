  - id: policy-sentinel:knowledge:D04
    kind: developer_method
    title: Preserve automated and manual review disagreement
    summary:
      Review the test oracle, retain rejected evidence and keep a manual
      disposition separate from the raw automated result.
    evidence_maturity: recorded_browser_repair_and_manual_disposition
    observed_scope:
      A masked-overflow pass was rejected. The terminal browser evidence
      preserves ten original incomplete nodes and ten targeted rescans that also
      remained incomplete, plus a separate finite manual review; the raw
      automated result remains unchanged.
    limits:
      - The disposition covers the recorded local pages, viewports and findings.
      - It is not universal accessibility certification.
    proposed_reuse:
      An auditable pattern for human review of automated accessibility and
      quality checks.
    tags:
      - accessibility
      - test-oracles
      - negative-results
    sources:
      - document: policy-sentinel:document:outcome
        section: Browser repair and review evidence
        observed_line: 43
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:X01
    kind: experimental_method
    title: Make compatibility loss explicit
    summary:
      Require a lossy compatibility view to report exactly what it omits and
      preserve the richer source evidence.
    evidence_maturity: isolated_experiment_not_converged
    observed_scope:
      The K0 implementation report describes omission receipts and
      non-interference for an isolated synthetic experiment.
    limits:
      - K0 is not a current product dependency while its convergence gate is
        closed.
      - Synthetic compatibility evidence does not establish real-source
        suitability.
    proposed_reuse:
      A candidate migration pattern to assess separately before adopting in
      another engine.
    tags:
