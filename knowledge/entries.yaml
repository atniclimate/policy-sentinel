    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:R01
    kind: research_question
    title: Can procedure similarities distinguish diffusion from boilerplate?
    summary:
      Study whether recurring procedural language has temporal and institutional
      evidence consistent with policy diffusion.
    evidence_maturity: unproven_research_question
    observed_scope:
      The strategic memo proposes a research direction; the current run does not
      establish diffusion.
    limits:
      - Rival explanations include shared upstream authority, boilerplate,
        missing versions and selection bias.
      - Text similarity alone is not causal evidence.
    proposed_reuse:
      Design a study with independently selected temporal comparisons, rival
      hypotheses and new evaluation data before making diffusion claims.
    tags:
      - policy-diffusion
      - institutional-analysis
      - political-ecology
    sources:
      - document: policy-sentinel:document:research
        section: Research that changes the design
        observed_line: 82
      - document: policy-sentinel:document:research
        section:
          A system that can learn without making its conclusions authoritative
