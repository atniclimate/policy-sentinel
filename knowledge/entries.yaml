        section: Final expanded discovery regression
        observed_line: 471
    extraction_review: curated_seed_not_a_new_acceptance_decision
    product_activation: none
    publication_status: not_reviewed_for_export
  - id: policy-sentinel:knowledge:M08
    kind: method
    title: Keep refresh health separate from source history
    summary:
      Use only eligible checksum-valid prior output from the same adapter and
      source, preserving its original data-as-of and a degraded state when a
      refresh fails.
    evidence_maturity: reported_controlled_failure_check
    observed_scope:
      The local acceptance includes controlled stale/degraded and unavailable
      projections.
    limits:
      - This is not proof of a scheduled refresh service or arbitrary power-loss
        recovery.
      - No eligible prior shard means unavailable; failure must not invent a new
        policy version.
    proposed_reuse:
      Failure semantics for static evidence products and reproducible pipelines.
    tags:
      - source-health
      - failure-semantics
      - reproducibility
    sources:
      - document: policy-sentinel:document:evaluation
        section: Controlled adversarial acceptance
        observed_line: 170
      - document: policy-sentinel:document:outcome
        section: Repository validation and proof limits
        observed_line: 154
    extraction_review: curated_seed_not_a_new_acceptance_decision
